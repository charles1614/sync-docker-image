name: Publish CLI to npm

# Tag the commit to release, e.g. `git tag cli-v1.0.1 && git push --tags`.
# Plain `v*` tags work too, for consistency with other repos.
on:
  push:
    tags:
      - "cli-v*"
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # npm >= 11.5.1 is needed for OIDC trusted publishing
      - run: npm install -g npm@latest

      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#cli-}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag version: $GITHUB_REF_NAME"
            exit 1
          fi
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
          fi

      - run: npm ci

      - run: npm test --if-present

      # npm silently rewrites parts of package.json at publish time. A bin path
      # written as "./sdi.js" gets dropped entirely, which `npm pack` does not
      # reproduce -- the tarball installs fine locally while the published
      # package ships with no executable. Fail loudly instead.
      - name: Check package.json needs no publish-time correction
        run: |
          cp package.json /tmp/pkg.before.json
          npm pkg fix
          if ! diff -u /tmp/pkg.before.json package.json; then
            echo "::error::package.json is not in its normalized form. Run 'npm pkg fix' in cli/ and commit the result."
            exit 1
          fi

      - name: Smoke test the published entry point
        run: |
          npm pack
          npm install -g ./sync-docker-image-cli-*.tgz
          sdi --version
          sdi help > /dev/null
          test -n "$(command -v sdi)" || { echo "::error::sdi was not linked onto PATH"; exit 1; }
          rm -f ./*.tgz

      - run: npm publish --access public
