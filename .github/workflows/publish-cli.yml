name: Publish CLI to npm

# Tag the commit to release, e.g. `git tag cli-v1.0.1 && git push --tags`.
# Plain `v*` tags work too, for consistency with other repos.
on:
  push:
    tags:
      - "cli-v*"
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # npm >= 11.5.1 is needed for OIDC trusted publishing
      - run: npm install -g npm@latest

      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#cli-}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag version: $GITHUB_REF_NAME"
            exit 1
          fi
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
          fi

      - run: npm ci

      - run: npm test --if-present

      - name: Smoke test the published entry point
        run: |
          npm pack
          npm install -g ./sync-docker-image-cli-*.tgz
          sdi --version
          sdi help > /dev/null
          rm -f ./*.tgz

      - run: npm publish --access public
